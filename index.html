<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Khojlo – Local tutors, services & jobs in Delhi</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--ink:#1d1b16;--mute:#6b665c;--line:#e8e2d6;--brand:#d9480f;--brand2:#fff1e8;--ok:#2b8a3e;--okbg:#e6f6ea}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);z-index:5}
.bar{max-width:980px;margin:auto;display:flex;align-items:center;gap:10px;padding:10px 14px;flex-wrap:wrap}
.logo{font-weight:800;font-size:20px;color:var(--brand);cursor:pointer}
nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav button{background:none;border:0;padding:7px 10px;border-radius:8px;font:inherit;color:var(--mute);cursor:pointer}
nav button.on{background:var(--brand2);color:var(--brand);font-weight:600}
main{max-width:980px;margin:auto;padding:14px}
h1{font-size:26px;margin:6px 0}h2{font-size:19px;margin:18px 0 8px}
.hero{background:linear-gradient(135deg,#fff1e8,#fff);border:1px solid var(--line);border-radius:16px;padding:18px}
.row{display:flex;gap:8px;flex-wrap:wrap}
input,select,textarea{font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;min-width:0}
textarea{width:100%;min-height:70px}
.row>input,.row>select{flex:1 1 140px}
.btn{background:var(--brand);color:#fff;border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn.sec{background:#fff;color:var(--brand);border:1px solid var(--brand)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.5}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;cursor:pointer;font-size:13px}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.card h3{margin:0;font-size:16px}
.meta{color:var(--mute);font-size:13px}
.badge{display:inline-block;background:var(--okbg);color:var(--ok);font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;margin-left:6px}
.badge.pro{background:#fff3bf;color:#8a6d00}
.price{font-weight:700}
.chat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;height:360px;overflow:auto;display:flex;flex-direction:column;gap:8px}
.msg{max-width:85%;padding:8px 12px;border-radius:14px}
.msg.bot{background:var(--brand2);align-self:flex-start}.msg.me{background:#e7f0ff;align-self:flex-end}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.price-card{border:2px solid var(--brand);border-radius:16px;padding:16px;background:#fff}
.ok{color:var(--ok);font-weight:600}.warn{background:#fff8e1;border:1px solid #f1d98a;border-radius:10px;padding:8px 12px;font-size:13px}
.hide{display:none}
.lock{filter:blur(4px);user-select:none}
footer{max-width:980px;margin:20px auto;padding:0 14px 30px;color:var(--mute);font-size:12px}
</style>
</head>
<body>
<header><div class="bar">
  <span class="logo" onclick="go('home')">Khojlo</span>
  <nav id="nav"></nav>
</div></header>
<main id="app"></main>
<footer>Khojlo beta. Payments and WhatsApp alerts are coming soon.</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL='https://llaxyqwehkzuukynyqgl.supabase.co';
const SUPABASE_KEY='sb_publishable_aNe-rRPWFUcsUcIkrbHp0Q_rdN2sTAg'; // publishable key: safe to be public
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let CATS=[],user=null,view='home',filt={cat:0,q:'',area:''},nextAfterAuth='dash';
const $=id=>document.getElementById(id);
const app=h=>{$('app').innerHTML=h};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const catName=id=>(CATS.find(c=>c.id==id)||{}).name||'';
const stars=r=>'★'.repeat(Math.round(r))+'☆'.repeat(5-Math.round(r));
const errMsg=e=>esc((e&&e.message)||'Something went wrong. Please try again.');
const clean=s=>String(s||'').replace(/[,()%*\\]/g,' ').trim();

/* ---------- ROUTER ---------- */
function navItems(){return [['home','Find'],['jobs','Jobs'],['enquire','Post enquiry'],['register','For providers'],['dash','Dashboard'],['pricing','Pricing']]}
function renderNav(){
 $('nav').innerHTML=navItems().map(([k,l])=>`<button class="${view===k?'on':''}" onclick="go('${k}')">${l}</button>`).join('')+
  (user?`<button onclick="logout()">Log out</button>`:`<button onclick="go('auth')">Log in</button>`);
}
async function go(v){view=v;renderNav();window.scrollTo(0,0);
 try{await ({home:vHome,jobs:vJobs,enquire:vEnquire,register:vRegister,dash:vDash,pricing:vPricing,auth:vAuth})[v]();}
 catch(e){app(`<div class="card" style="color:#c92a2a">${errMsg(e)}</div>`)}}
async function logout(){await sb.auth.signOut();user=null;go('home')}

/* ---------- AUTH ---------- */
function vAuth(){
 app(`<h1>Provider login</h1><div class="meta">Tutors and service providers sign in with email and password. Customers do not need an account.</div>
 <div class="card"><div class="row"><input id="au" type="email" placeholder="Email" autocomplete="email"><input id="ap" type="password" placeholder="Password (min 6 characters)" autocomplete="current-password"></div>
 <div id="aerr" class="meta" style="color:#c92a2a;margin:6px 0"></div>
 <div class="row"><button class="btn" onclick="doAuth('login')">Log in</button><button class="btn sec" onclick="doAuth('signup')">Create account</button></div></div>`);
}
async function doAuth(mode){
 const email=$('au').value.trim(),password=$('ap').value;
 if(!email||password.length<6){$('aerr').textContent='Enter an email and a password of at least 6 characters.';return}
 $('aerr').textContent='';
 try{
  if(mode==='signup'){
   const {data,error}=await sb.auth.signUp({email,password});if(error)throw error;
   if(!data.session){$('aerr').style.color='#2b8a3e';$('aerr').textContent='Check your email to confirm your account, then log in.';return}
   user=data.user;
  }else{
   const {data,error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;user=data.user;
  }
  go(nextAfterAuth||'dash');
 }catch(e){$('aerr').style.color='#c92a2a';$('aerr').textContent=(e&&e.message)||'Login failed.'}
}
async function requireUser(next){
 if(user)return true;nextAfterAuth=next;await go('auth');return false;
}

/* ---------- HOME / SEARCH ---------- */
async function vHome(){
 app(`<div class="hero"><h1>Find trusted tutors, repairs & more in Delhi</h1>
 <div class="meta">Local providers. Request a call back in 30 seconds.</div>
 <div class="row" style="margin-top:12px">
  <input id="q" placeholder="What do you need? e.g. maths" value="${esc(filt.q)}" onkeydown="if(event.key==='Enter')doSearch()">
  <input id="area" placeholder="Area e.g. Dwarka" value="${esc(filt.area)}" onkeydown="if(event.key==='Enter')doSearch()">
  <button class="btn" onclick="doSearch()">Search</button></div>
 <div class="chips"><span class="chip ${!filt.cat?'on':''}" onclick="setCat(0)">All</span>${CATS.filter(c=>c.kind!=='job').map(c=>`<span class="chip ${filt.cat==c.id?'on':''}" onclick="setCat(${c.id})">${esc(c.name)}</span>`).join('')}
 <span class="chip" onclick="go('jobs')">Jobs →</span></div></div><div id="results"><div class="meta" style="margin-top:12px">Loading…</div></div>`);
 await showResults();
}
function setCat(i){filt.cat=i;vHome()}
function doSearch(){filt.q=$('q').value;filt.area=$('area').value;showResults()}
async function showResults(){
 let q=sb.from('provider_directory').select('*');
 if(filt.cat)q=q.eq('category_id',filt.cat);
 const a=clean(filt.area),t=clean(filt.q);
 if(a)q=q.ilike('area','%'+a+'%');
 if(t)q=q.or(`headline.ilike.%${t}%,name.ilike.%${t}%,subjects.cs.{${t.toLowerCase()}}`);
 const {data,error}=await q.order('plan',{ascending:false}).order('rating_avg',{ascending:false}).limit(50);
 if(error){$('results').innerHTML=`<div class="card" style="color:#c92a2a">${errMsg(error)}</div>`;return}
 const list=data||[];
 $('results').innerHTML=`<h2>${list.length} provider${list.length==1?'':'s'}</h2>`+(list.map(p=>`<div class="card">
  <h3>${esc(p.name)}${p.verified?'<span class="badge">Verified</span>':''}${p.plan==='pro'?'<span class="badge pro">Top listed</span>':''}</h3>
  <div>${esc(p.headline)}</div>
  <div class="meta">${esc(catName(p.category_id))} · ${esc(p.area)} · ${p.mode==='both'?'Home & online':esc(p.mode)} · ${esc(p.experience_years)} yrs</div>
  <div class="meta">${p.rating_count?`<span style="color:#f59f00">${stars(p.rating_avg)}</span> ${esc(p.rating_avg)} (${esc(p.rating_count)})`:'New'}${p.rate_per_hour?` · <span class="price">₹${esc(p.rate_per_hour)}/hr</span>`:''}</div>
  <div style="margin-top:8px"><button class="btn sm" onclick='callback(${JSON.stringify(p.id)})'>Get call back</button></div></div>`).join('')||'<div class="card">No match. Try <a href="#" onclick="go(\'enquire\');return false">posting an enquiry</a> and we will find someone.</div>');
 window._dir=Object.fromEntries(list.map(p=>[p.id,p]));
}
function callback(pid){const p=(window._dir||{})[pid];if(!p)return;
 app(`<h1>Request call back</h1><div class="card"><b>${esc(p.name)}</b><div class="meta">${esc(p.headline)}</div></div>`+enqForm(p.category_id,(p.subjects||[]).join(', '),p.area));
}

/* ---------- ENQUIRY ---------- */
function enqForm(cat,req,area){return `<div class="card"><div class="row">
 <select id="ec">${CATS.filter(c=>c.kind!=='job').map(c=>`<option value="${c.id}" ${c.id==cat?'selected':''}>${esc(c.name)}</option>`).join('')}</select>
 <input id="en" placeholder="Your name"><input id="ep" placeholder="Phone (10 digits)" inputmode="numeric"></div>
 <div class="row" style="margin-top:8px"><input id="ea" placeholder="Area" value="${esc(area||'')}"><input id="eb" placeholder="Budget ₹ (optional)" inputmode="numeric"></div>
 <textarea id="er" style="margin-top:8px" placeholder="What do you need? e.g. Class 10 maths, 3 days a week">${esc(req||'')}</textarea>
 <div id="eerr" class="meta" style="color:#c92a2a"></div>
 <button class="btn" id="esub" onclick="submitEnq()">Submit enquiry</button></div><div id="eres"></div>`}
function vEnquire(){app(`<h1>Tell us what you need</h1><div class="meta">We send your enquiry to the best matching providers.</div>`+enqForm(1,'',''))}
async function submitEnq(){
 const name=$('en').value.trim(),phone=$('ep').value.replace(/\D/g,''),req=$('er').value.trim();
 if(name.length<2||phone.length!==10||req.length<5){$('eerr').textContent='Enter your name, a 10-digit phone and a short requirement.';return}
 $('eerr').textContent='';$('esub').disabled=true;
 const {data,error}=await sb.rpc('submit_enquiry',{p_category:+$('ec').value,p_name:name,p_phone:phone,p_requirement:req,p_area:$('ea').value.trim(),p_budget:+$('eb').value||null});
 $('esub').disabled=false;
 if(error){$('eerr').textContent=error.message;return}
 const m=(data&&data.matched)||[];
 $('eres').innerHTML=`<div class="card"><div class="ok">Sent to ${m.length} provider${m.length==1?'':'s'}.</div><div class="meta">They will call you on ${esc(phone)}.</div>${m.map(p=>`<div>• ${esc(p.name)} – ${esc(p.area)}</div>`).join('')||'<div class="meta">No provider matched yet. We will keep your request.</div>'}</div>`;
}

/* ---------- JOBS ---------- */
async function vJobs(){
 const {data,error}=await sb.from('jobs').select('*').eq('status','open').order('created_at',{ascending:false}).limit(50);
 if(error)throw error;
 app(`<h1>Jobs & gigs</h1><div class="meta">Hawker, delivery, repair helper and more.</div>
 ${(data||[]).map(j=>`<div class="card"><h3>${esc(j.title)}</h3><div>${esc(j.description)}</div><div class="meta">${esc(catName(j.category_id))} · ${esc(j.area)} · <b>${esc(j.pay_text)}</b></div><div class="meta">Contact: ${esc(j.contact_phone)}</div></div>`).join('')||'<div class="card meta">No jobs yet.</div>'}
 <h2>Post a job</h2><div class="card"><div class="row"><input id="jt" placeholder="Job title"><select id="jc">${CATS.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div>
 <div class="row" style="margin-top:8px"><input id="ja" placeholder="Area"><input id="jp" placeholder="Pay e.g. ₹10,000/mo"><input id="jph" placeholder="Contact phone (10 digits)" inputmode="numeric"></div>
 <textarea id="jd" style="margin-top:8px" placeholder="Details"></textarea><div id="jerr" class="meta" style="color:#c92a2a"></div><button class="btn" onclick="postJob()">Post job</button></div>`);
}
async function postJob(){
 const t=$('jt').value.trim(),ph=$('jph').value.replace(/\D/g,'');
 if(t.length<3||ph.length!==10){$('jerr').textContent='Add a title and a 10-digit contact phone.';return}
 const {error}=await sb.from('jobs').insert({category_id:+$('jc').value,title:t,description:$('jd').value.trim(),area:$('ja').value.trim(),pay_text:$('jp').value.trim(),contact_phone:ph});
 if(error){$('jerr').textContent=error.message;return}
 vJobs();
}

/* ---------- PROVIDER REGISTRATION (voice + text agent) ---------- */
const STEPS=[
 {k:'name',q:'Hi! I will build your profile. What is your name?'},
 {k:'phone',q:'Your 10-digit mobile number?'},
 {k:'category',q:'What do you offer? Say one: tutor, admission consultant, assignment help, repair.'},
 {k:'subjects',q:'Which subjects or services? e.g. maths, physics, JEE'},
 {k:'area',q:'Which area of Delhi are you based in?'},
 {k:'mode',q:'Do you teach/serve at home, online, or both?'},
 {k:'rate',q:'Your rate per hour in rupees? (say 0 if not applicable)'},
 {k:'exp',q:'How many years of experience?'},
 {k:'bio',q:'Last one: tell parents/customers about yourself in a sentence or two.'}];
let draft={},si=0,rec=null;
const nums=s=>{const m=String(s).replace(/,/g,'').match(/\d+/);return m?+m[0]:NaN};
async function vRegister(){
 if(!await requireUser('register'))return;
 const {data:mine}=await sb.from('providers').select('id').eq('user_id',user.id).maybeSingle();
 if(mine){return go('dash')}
 app(`<h1>List your service</h1><div class="meta">Talk or type. Our assistant builds your profile. Free to list, 3 free leads, then ₹499/month.</div>
 <div class="chat" id="chat" style="margin-top:10px"></div>
 <div class="row" style="margin-top:8px"><input id="ci" placeholder="Type your answer" onkeydown="if(event.key==='Enter')send()">
 <button class="btn sec" id="mic" onclick="mic()">🎤 Speak</button><button class="btn" onclick="send()">Send</button></div>
 <div id="regout"></div><div class="meta" style="margin-top:6px">Voice needs Chrome or Safari with microphone permission. Hindi and English both work.</div>`);
 draft={};si=0;say(STEPS[0].q,'bot');
}
function say(t,who){const c=$('chat');if(!c)return;c.insertAdjacentHTML('beforeend',`<div class="msg ${who}">${esc(t)}</div>`);c.scrollTop=c.scrollHeight}
function mic(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){say('Voice is not available in this browser. Please type your answer.','bot');return}
 try{rec=new SR();rec.lang='en-IN';rec.interimResults=false;
  rec.onresult=e=>{$('ci').value=e.results[0][0].transcript;send()};
  rec.onerror=()=>say('Could not hear you. Please type instead.','bot');
  rec.onend=()=>{$('mic').textContent='🎤 Speak'};
  rec.start();$('mic').textContent='Listening…';
 }catch(e){say('Microphone is blocked. Please type your answer.','bot')}
}
function send(){
 const v=$('ci').value.trim();if(!v||si>=STEPS.length)return;$('ci').value='';
 const s=STEPS[si];let val=v,err='';
 if(s.k==='phone'){val=v.replace(/\D/g,'').slice(-10);if(val.length!==10)err='Please give a 10-digit number.'}
 if(s.k==='category'){const l=v.toLowerCase();const c=l.includes('admission')||l.includes('consult')?2:l.includes('assign')?3:l.includes('repair')?4:l.includes('tutor')||l.includes('teach')?1:0;if(!c)err='Please say tutor, admission consultant, assignment help or repair.';val=c}
 if(s.k==='subjects')val=v.toLowerCase().split(/,|\band\b|\baur\b/).map(x=>x.trim()).filter(Boolean).slice(0,12);
 if(s.k==='mode'){const l=v.toLowerCase();val=l.includes('both')||(l.includes('home')&&l.includes('online'))?'both':l.includes('online')?'online':l.includes('home')?'home':'';if(!val)err='Say home, online or both.'}
 if(s.k==='rate'||s.k==='exp'){val=nums(v);if(isNaN(val))err='Please give a number.';else if(s.k==='rate'&&val>100000)err='That looks too high. Rate per hour in rupees?'}
 if(s.k==='name'&&v.length<2)err='Please give your name.';
 say(v,'me');
 if(err){say(err,'bot');return}
 draft[s.k]=val;si++;
 if(si<STEPS.length)say(STEPS[si].q,'bot');else finishReg();
}
function finishReg(){
 const d=draft;say('Great! Here is your profile. Review and publish.','bot');
 $('regout').innerHTML=`<div class="card"><h3>${esc(d.name)}</h3><div>${esc(d.subjects.join(', '))}</div><div class="meta">${esc(catName(d.category))} · ${esc(d.area)} · ${esc(d.mode)} · ${esc(d.exp)} yrs${d.rate?` · ₹${esc(d.rate)}/hr`:''}</div><div>${esc(d.bio)}</div>
 <div class="warn" style="margin:8px 0">Includes 3 free leads. After that, ₹499/month for unlimited leads and top listing.</div>
 <div id="perr" class="meta" style="color:#c92a2a"></div><button class="btn" onclick="publish()">Publish my profile</button></div>`;
}
async function publish(){
 const d=draft;
 const {error}=await sb.from('providers').insert({user_id:user.id,category_id:d.category,name:d.name,phone:d.phone,headline:d.subjects.slice(0,3).join(', '),bio:d.bio,subjects:d.subjects,area:d.area,mode:d.mode,rate_per_hour:d.rate,experience_years:d.exp});
 if(error){$('perr').textContent=error.code==='23505'?'You already have a profile.':error.message;return}
 $('regout').innerHTML=`<div class="card"><div class="ok">You are live!</div><div class="meta">Check your dashboard for leads.</div><button class="btn" onclick="go('dash')">Open dashboard</button></div>`;
}

/* ---------- DASHBOARD ---------- */
async function vDash(){
 if(!await requireUser('dash'))return;
 const {data:p}=await sb.from('providers').select('*').eq('user_id',user.id).maybeSingle();
 if(!p){app(`<h1>Dashboard</h1><div class="card">You have no provider profile yet. <button class="btn sm" onclick="go('register')">Create profile</button></div>`);return}
 const {data:ls,error}=await sb.rpc('my_leads');if(error)throw error;
 const pro=p.plan==='pro'&&(!p.plan_expires_at||new Date(p.plan_expires_at)>new Date());
 app(`<h1>Dashboard</h1><div class="card"><h3>${esc(p.name)} ${pro?'<span class="badge pro">Pro</span>':''}</h3>
 <div class="meta">${pro?'Unlimited leads and top listing.':`Free leads left: <b>${esc(p.free_leads_left)}</b>`}</div>
 ${pro?'':'<button class="btn sm" style="margin-top:6px" onclick="go(\'pricing\')">Upgrade ₹499/mo</button>'}</div>
 <h2>Leads (${(ls||[]).length})</h2>`+((ls||[]).map(l=>`<div class="card"><div><b>${esc(l.requirement)}</b></div><div class="meta">${esc(catName(l.category_id))} · ${esc(l.area||'')}${l.budget?` · budget ₹${esc(l.budget)}`:''}</div>
 <div>${l.unlocked?`<span class="ok">${esc(l.customer_name)} – ${esc(l.customer_phone)}</span>`:`<span class="lock">Customer name – 98xxx xxxxx</span> <button class="btn sm" onclick="go('pricing')">Unlock</button>`}</div></div>`).join('')||'<div class="card meta">No leads yet. They appear here when customers post matching enquiries.</div>'));
}

/* ---------- PRICING ---------- */
function vPricing(){
 app(`<h1>Pricing for providers</h1><div class="grid">
 <div class="card"><h3>Free</h3><div class="price">₹0</div><ul><li>Profile listing</li><li>3 free leads</li><li>Normal ranking</li></ul></div>
 <div class="price-card"><h3>Pro</h3><div class="price">₹499 / month</div><ul><li>Unlimited student & customer leads</li><li>Top listing + “Top listed” badge</li><li>WhatsApp lead alerts (coming soon)</li><li>Priority verification</li></ul>
 <div class="warn">Online payment is coming soon. To activate Pro now, contact us and we will switch it on for your account.</div></div></div>`);
}

/* ---------- START ---------- */
(async()=>{
 try{const {data}=await sb.auth.getSession();user=data.session?data.session.user:null}catch(e){}
 sb.auth.onAuthStateChange((_e,s)=>{user=s?s.user:null;renderNav()});
 try{const {data}=await sb.from('categories').select('*').order('id');CATS=data||[]}catch(e){}
 go('home');
})();
</script>
</body>
</html>
